{% extends "base.html" %}
{% load static %}

{% block title %}Replay — Flight Monitor{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #replay-layout {
      display: grid;
      grid-template-rows: 1fr 220px 52px;
      height: 100%;
      overflow: hidden;
    }
    #replay-map { width: 100%; height: 100%; }
    #replay-chart { padding: 8px 16px; }
    #replay-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }
    #replay-controls button {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #replay-controls button:hover { background: var(--bg-tertiary); }
    #replay-progress {
      flex: 1;
      accent-color: var(--accent-active);
    }
    .speed-btn { font-size: 0.8rem; }
    .speed-btn.active { background: var(--accent-blue) !important; border-color: var(--accent-active) !important; }
  </style>
{% endblock %}

{% block content %}
  <div id="replay-layout">
    <div id="replay-map"></div>
    <div id="replay-chart">
      <div id="uplot-replay"></div>
    </div>
    <div id="replay-controls">
      <button id="btn-play" title="재생">▶</button>
      <button id="btn-pause" title="일시정지">⏸</button>
      <button id="btn-stop" title="정지">⏹</button>
      <input type="range" id="replay-progress" min="0" max="100" value="0">
      <span id="replay-time" style="color: var(--text-muted); font-size: 0.85rem; min-width: 80px;">00:00</span>
      <div class="d-flex gap-1">
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="2">2x</button>
        <button class="speed-btn" data-speed="4">4x</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{% static 'js/uplot.min.js' %}"></script>
  <script src="{% static 'js/replay.js' %}"></script>
{% endblock %}
