<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Chart — External Monitor</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/strip_chart.css' %}">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
    }
    /* 외부창 전용: chart-page가 뷰포트 전체를 차지 */
    #chart-page { height: 100vh; }
    /* 외부창 상단 타이틀바 */
    #ext-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      height: 32px;
      flex-shrink: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
      user-select: none;
    }
    #ext-titlebar .ext-brand {
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.04em;
    }
    #ext-bc-status {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
    }
    #ext-bc-status.connected {
      color: #44ff88;
      background: rgba(68, 255, 136, 0.08);
      border: 1px solid rgba(68, 255, 136, 0.3);
    }
    #ext-bc-status.disconnected {
      color: #ff4444;
      background: rgba(255, 68, 68, 0.08);
      border: 1px solid rgba(255, 68, 68, 0.3);
    }
  </style>
</head>
<body>

<div id="chart-page">

  <!-- 외부창 전용 상태바 -->
  <div id="ext-titlebar">
    <span class="ext-brand">📈 Data Chart — External Monitor</span>
    <span id="ext-bc-status" class="disconnected">● 메인창 대기 중</span>
  </div>

  <!-- 툴바 (외부창 열기 버튼 제외, 나머지 동일) -->
  <div id="chart-toolbar">
    <div class="toolbar-left">
      <select id="sel-group" class="toolbar-select">
        <option value="">-- 분야 선택 --</option>
      </select>
      <select id="sel-channel" class="toolbar-select" disabled>
        <option value="">-- 항목 선택 --</option>
      </select>
      <button id="btn-chart" disabled>Chart</button>
      <button id="btn-clear-layout">Clear</button>
      <span class="grid-divider"></span>
      <button id="btn-save-layout" class="btn-layout-action">💾 저장</button>
      <button id="btn-load-layout" class="btn-layout-action">📂 불러오기</button>
      <input type="file" id="layout-file-input" accept=".ini" style="display:none">
    </div>
    <div class="toolbar-right">
      <span id="udp-status" class="udp-status" style="display:none">● Disconnect</span>
      <span class="grid-label">배열</span>
      <button class="btn-grid active" data-grid="2x2">2×2</button>
      <button class="btn-grid" data-grid="3x3">3×3</button>
      <button class="btn-grid" data-grid="4x3">4×3</button>
      <span class="grid-divider"></span>
      <input type="number" id="grid-cols-input" class="grid-custom-input" min="1" max="8" value="2">
      <span class="grid-x-label">×</span>
      <input type="number" id="grid-rows-input" class="grid-custom-input" min="1" max="6" value="2">
      <button id="btn-grid-custom">적용</button>
    </div>
  </div>

  <div id="dock-area"></div>

</div>

<script src="{% static 'js/uplot.min.js' %}"></script>
<script src="{% static 'js/strip_chart.js' %}"></script>
<script>
  // BroadcastChannel 연결 상태를 타이틀바에 반영
  (function () {
    const statusEl = document.getElementById('ext-bc-status');
    let connTimer  = null;

    function setConnected(ok) {
      if (ok) {
        statusEl.textContent = '● 메인창 연결됨';
        statusEl.className   = 'connected';
      } else {
        statusEl.textContent = '● 메인창 대기 중';
        statusEl.className   = 'disconnected';
      }
    }

    // flightData 이벤트가 수신될 때마다 연결 상태 갱신
    window.addEventListener('flightData', () => {
      setConnected(true);
      clearTimeout(connTimer);
      connTimer = setTimeout(() => setConnected(false), 5000);
    });
  })();
</script>

</body>
</html>
